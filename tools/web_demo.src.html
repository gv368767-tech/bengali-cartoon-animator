<title>Bengali Cartoon Studio ডেমো</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* লেআউট: উপরে আটকানো স্টেজ + ট্রান্সপোর্ট, নিচে চরিত্র/ভিউ/লিপ-সিঙ্ক/সার্চ/তালিকা */
:root{--bg:#f3f1ec;--panel:#ffffff;--panel2:#e9e6df;--line:#d6d1c6;--fg:#1d1f24;--dim:#6a6e78;--accent:#d98200;--accent-fg:#111;--teal:#0f8f83;--stage:#fdfdf6;--font:"Hind Siliguri",system-ui,sans-serif;--mono:"Space Grotesk",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15171c;--panel:#1e2128;--panel2:#2a2e38;--line:#3a3f4c;--fg:#eef0f4;--dim:#9aa1b2;--accent:#ffb020;--teal:#1fb6a6;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15171c;--panel:#1e2128;--panel2:#2a2e38;--line:#3a3f4c;--fg:#eef0f4;--dim:#9aa1b2;--accent:#ffb020;--teal:#1fb6a6;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 28px}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:17px;margin:0;padding:12px 0 8px}
.sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-bottom:8px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
#stage{position:relative;background:var(--stage);border-radius:14px;overflow:hidden;aspect-ratio:280/290;max-height:46vh;width:100%;margin:0 auto}
#stage svg{width:100%;height:100%;display:block}
#badge{position:absolute;top:8px;left:8px;background:#000b;color:#fff;border-radius:10px;padding:3px 10px;font-weight:700;font-size:13px}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
button,input,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:0;border-radius:10px;padding:10px 12px;font-weight:700;font-size:13px;cursor:pointer;min-height:40px}
button.on{background:var(--teal);color:#fff}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chip{border-radius:14px;padding:6px 12px;min-height:0}
.chip.on{background:var(--accent);color:var(--accent-fg)}
.lbl{color:var(--dim);font-size:12px;margin:12px 0 4px}
.who{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px}
.who button{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;padding:4px 6px;background:var(--panel);border:2px solid transparent;min-width:62px}
.who button.on{border-color:var(--accent);background:var(--panel)}
.who svg{width:48px;height:56px;background:var(--stage);border-radius:8px}
.who span{font-size:11px;margin-top:2px}
textarea,input[type=search]{width:100%;box-sizing:border-box;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:15px}
textarea{min-height:56px;resize:vertical}
#list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#list button{background:var(--panel);text-align:left;font-size:14px;padding:7px 12px;border:1px solid var(--line)}
#list button small{display:block;font-weight:400;font-size:10px;color:var(--dim);font-family:var(--mono)}
#list button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
#list button.on small{color:#333}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dim{color:var(--dim);font-size:12px}
.spacer{margin-left:auto}
</style>
<div class="wrap">
  <div class="sticky">
    <h1>🎭 Bengali Cartoon Studio — অ্যানিমেশন ডেমো</h1>
    <div id="stage"><svg id="svg" viewBox="-110 -375 280 395" role="img" aria-label="অ্যানিমেটেড ক্যারেক্টার"></svg><div id="badge"></div></div>
    <div class="row">
      <button id="play" class="on">▶ Play</button><button id="pause">⏸ Pause</button><button id="stop">⏹ Stop</button><button id="all">🔁 সব ৩০টি</button>
      <span class="spacer mono dim" id="clock">0.0s</span>
    </div>
    <div class="row"><span class="dim">গতি</span><span id="speeds" class="row" style="margin:0"></span></div>
  </div>
  <div class="lbl">ক্যারেক্টার বাছুন</div><div class="who" id="who"></div>
  <div class="lbl">ভিউ (দেখার দিক)</div><div class="row" id="views" style="margin-top:0"></div>
  <div class="lbl">লিপ-সিঙ্ক — "কথা বলা / পড়ানো / ফোন / রাগ"-এ ঠোঁট এই লেখা অনুযায়ী নড়ে</div>
  <textarea id="lip" aria-label="লিপ-সিঙ্কের লেখা">নমস্কার, আমি তোমার বন্ধু। আজ আমরা গল্প করব।</textarea>
  <div class="row"><button id="say">🔊 বলুন</button><span class="dim">ঠোঁটের আকৃতি: <b class="mono" id="mouth">—</b></span></div>
  <div class="lbl">অ্যানিমেশন খুঁজুন</div>
  <input id="q" type="search" placeholder="🔍 হাঁটা, cook, ভয়, wave…" aria-label="অ্যানিমেশন সার্চ">
  <div class="row" id="cats"></div>
  <div id="list"></div>
</div>
<script>__BUNDLE__</script>
<script>
(function(){
const {buildAsset,getAsset,ASSETS,ANIMS,ANIM_CATS,VIEWS,searchAnims,mouthAt,rateOf,shapesToSvg}=Studio;
const $=id=>document.getElementById(id);
const HUMANS=ASSETS.filter(a=>a.cat==="human");
const LIP=new Set(["talk","teach","phone","angry"]);
const SEG=4;
const S={who:HUMANS[0].id,view:"front",anim:"walk",playing:true,all:false,speed:1,t:0,q:"",cat:"all"};
const svg=$("svg");
function draw(shapes){const r=shapesToSvg(shapes);svg.innerHTML="<defs>"+r.defs+"</defs>"+r.body;}
function ground(act,phase){
  const g=[{t:"line",x1:-300,y1:0,x2:400,y2:0,w:4,color:"#9aa38f"}];
  const off=(act==="walk"||act==="run"||act==="carry")?-((phase*22)%70):0;
  for(let i=-6;i<8;i++)g.push({t:"line",x1:i*70+off,y1:14,x2:i*70+off+34,y2:14,w:3,color:"#b9c0ae"});
  return g;
}
const cur=()=>S.all?ANIMS[Math.floor(S.t/SEG)%ANIMS.length].id:S.anim;
let lastIdx=-1;
function frame(){
  const act=cur(), phase=S.t*rateOf(act), a=getAsset(S.who);
  const dur=Math.max(1.5,$("lip").value.trim().length*0.09);
  const m=LIP.has(act)?mouthAt($("lip").value,S.t%(dur+0.6),dur):null;
  draw([...ground(act,phase),...buildAsset(a,{action:act,phase,talk:0,blink:(S.t%3.4)<0.12,view:S.view,mouth:m})]);
  const info=ANIMS.find(x=>x.id===act);
  $("badge").textContent=info.bn+" · "+info.en+(S.all?"  ("+((Math.floor(S.t/SEG)%ANIMS.length)+1)+"/"+ANIMS.length+")":"");
  $("clock").textContent=S.t.toFixed(1)+"s";
  $("mouth").textContent=m?m.shape+" "+Math.round(m.open*100)+"%":(LIP.has(act)?"বিরতি":"—");
  const idx=S.all?Math.floor(S.t/SEG)%ANIMS.length:-1;
  if(idx!==lastIdx){lastIdx=idx;renderList();}
}
let last=performance.now();
function loop(now){const dt=(now-last)/1000;last=now;if(S.playing)S.t+=dt*S.speed;frame();requestAnimationFrame(loop);}
function setPlaying(p){S.playing=p;$("play").classList.toggle("on",p);$("pause").classList.toggle("on",!p&&S.t>0);}
$("play").onclick=()=>setPlaying(true);
$("pause").onclick=()=>setPlaying(false);
$("stop").onclick=()=>{S.t=0;S.all=false;$("all").classList.remove("on");setPlaying(false);window.speechSynthesis&&speechSynthesis.cancel();renderList();frame();};
$("all").onclick=()=>{S.all=!S.all;S.t=0;lastIdx=-2;$("all").classList.toggle("on",S.all);setPlaying(true);renderList();};
function pick(id){S.all=false;$("all").classList.remove("on");S.anim=id;S.t=0;setPlaying(true);renderList();}
$("say").onclick=()=>{pick("talk");try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance($("lip").value);u.lang="bn-BD";speechSynthesis.speak(u);}catch(e){}};
[0.5,1,1.5,2].forEach(v=>{const b=document.createElement("button");b.className="chip"+(v===1?" on":"");b.textContent=v+"×";b.onclick=()=>{S.speed=v;[...$("speeds").children].forEach(c=>c.classList.toggle("on",c===b));};$("speeds").appendChild(b);});
HUMANS.forEach(h=>{const b=document.createElement("button");b.dataset.id=h.id;b.className=h.id===S.who?"on":"";const sv=document.createElementNS("http://www.w3.org/2000/svg","svg");sv.setAttribute("viewBox","-100 -375 200 395");const r=shapesToSvg(buildAsset(h,{action:"stand",phase:0.3,talk:0,blink:false}));sv.innerHTML="<defs>"+r.defs+"</defs>"+r.body;b.appendChild(sv);const sp=document.createElement("span");sp.textContent=h.name;b.appendChild(sp);b.onclick=()=>{S.who=h.id;[...$("who").children].forEach(c=>c.classList.toggle("on",c===b));};$("who").appendChild(b);});
VIEWS.forEach(v=>{const b=document.createElement("button");b.className="chip"+(v.id===S.view?" on":"");b.textContent=v.en;b.dataset.view=v.id;b.onclick=()=>{S.view=v.id;[...$("views").children].forEach(c=>c.classList.toggle("on",c===b));};$("views").appendChild(b);});
ANIM_CATS.forEach(c=>{const b=document.createElement("button");b.className="chip"+(c.id==="all"?" on":"");b.textContent=c.bn;b.onclick=()=>{S.cat=c.id;[...$("cats").children].forEach(x=>x.classList.toggle("on",x===b));renderList();};$("cats").appendChild(b);});
$("q").oninput=e=>{S.q=e.target.value;renderList();};
function renderList(){
  const list=searchAnims(S.q,S.cat), act=cur();
  const L=$("list");L.innerHTML="";
  list.forEach(a=>{const b=document.createElement("button");b.dataset.id=a.id;b.className=(!S.all&&S.anim===a.id)||(S.all&&act===a.id)?"on":"";b.innerHTML=a.bn+"<small>"+a.en+"</small>";b.onclick=()=>pick(a.id);L.appendChild(b);});
  if(!list.length)L.innerHTML='<span class="dim">কিছু পাওয়া যায়নি।</span>';
}
window.__demo={S,pick};
renderList();requestAnimationFrame(loop);
})();
</script>

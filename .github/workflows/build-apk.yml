name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm test
      - run: npx tsc --noEmit
        continue-on-error: true
      - run: npx expo prebuild --platform android --no-install
      - run: cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Verify signing certificate is unchanged (so the APK updates over the old app)
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          FP=$(keytool -printcert -jarfile "$APK" | grep "SHA256:" | head -1 | sed 's/.*SHA256: *//')
          echo "cert: $FP"
          test "$FP" = "FA:C6:17:45:DC:09:03:78:6F:B9:ED:E6:2A:96:2B:39:9F:73:48:F0:BB:6F:89:9B:83:32:66:75:91:03:3B:9C"
      - name: Privacy gate - the APK must have NO internet permission and NO cloud backup
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT dump permissions "$APK" | tee perms.txt
          ! grep -E "INTERNET|ACCESS_NETWORK_STATE|RECORD_AUDIO|SYSTEM_ALERT_WINDOW" perms.txt
          $AAPT dump xmltree --file AndroidManifest.xml "$APK" | grep -i "allowBackup" | tee backup.txt
          grep -qE "allowBackup.*=(false|\(type 0x12\)0x0)" backup.txt
      - name: Verify package name and versionCode match the installed app
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT dump badging "$APK" | grep "^package:"
          $AAPT dump badging "$APK" | grep -q "package: name='com.bengalicartoon.animator'"
          VC=$($AAPT dump badging "$APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          test "$VC" -gt 1
      - uses: actions/upload-artifact@v4
        with:
          name: BengaliCartoonAnimator-apk
          path: android/app/build/outputs/apk/release/*.apk
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/*.apk BengaliCartoonAnimator.apk
          gh release create "apk-${{ github.run_number }}" BengaliCartoonAnimator.apk \
            --title "APK #${{ github.run_number }}" --notes "Bengali Cartoon Animator Android APK"

name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm test
      - run: npx tsc --noEmit
        continue-on-error: true
      - run: npx expo prebuild --platform android --no-install
      - run: cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - uses: actions/upload-artifact@v4
        with:
          name: BengaliCartoonAnimator-apk
          path: android/app/build/outputs/apk/release/*.apk
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/*.apk BengaliCartoonAnimator.apk
          gh release create "apk-${{ github.run_number }}" BengaliCartoonAnimator.apk \
            --title "APK #${{ github.run_number }}" --notes "Bengali Cartoon Animator Android APK"

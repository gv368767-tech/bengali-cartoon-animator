name: Build check (branch, no release)
on:
  push:
    branches: [motion-transfer-prototype]
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm test
      - run: npx tsc --noEmit
        continue-on-error: true
      - run: npx expo prebuild --platform android --no-install
      - run: cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Verify signing certificate is unchanged (so the APK updates over the old app)
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          # minSdk 24+ হলে APK কেবল v2/v3 সইয়ে সই হয় (keytool শুধু পুরোনো v1 সই পড়ে) — তাই apksigner
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | tail -1)
          FP=$($APKSIGNER verify --print-certs "$APK" | grep -m1 "certificate SHA-256 digest" | sed 's/.*: *//' | tr -d ':' | tr 'a-f' 'A-F')
          echo "cert: $FP"
          test "$FP" = "FAC61745DC0903786FB9EDE62A962B399F7348F0BB6F899B8332667591033B9C"
      - name: Privacy gate - the APK must have NO internet permission and NO cloud backup
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT dump permissions "$APK" | tee perms.txt
          ! grep -E "INTERNET|ACCESS_NETWORK_STATE|RECORD_AUDIO|SYSTEM_ALERT_WINDOW" perms.txt
          $AAPT dump xmltree --file AndroidManifest.xml "$APK" | grep -i "allowBackup" | tee backup.txt
          grep -qE "allowBackup.*=(false|\(type 0x12\)0x0)" backup.txt
      - name: Verify package name and versionCode match the installed app
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          AAPT=$(ls $ANDROID_HOME/build-tools/*/aapt2 | tail -1)
          $AAPT dump badging "$APK" | grep "^package:"
          $AAPT dump badging "$APK" | grep -q "package: name='com.bengalicartoon.animator'"
          VC=$($AAPT dump badging "$APK" | sed -n "s/.*versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          test "$VC" -gt 1
      - uses: actions/upload-artifact@v4
        with:
          name: BengaliCartoonAnimator-apk
          path: android/app/build/outputs/apk/release/*.apk
